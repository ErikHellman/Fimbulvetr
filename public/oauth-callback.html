<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Fimbulvetr</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0a14;
        color: #f2ead8;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p>
      You can close this window and go back to the game.<br />
      Du kan stänga det här fönstret och gå tillbaka till spelet.
    </p>
    <script>
      // Dropbox or Google sends the player here after signing in. The game (in the opener tab, or in this tab after a
      // full-page redirect) reads the result from localStorage: see src/shell/platform/cloud/cloudSaves.ts.
      // Dropbox answers in the query, Google in the fragment: both go on as one query string.
      const query = location.search + (location.hash.length > 1 ? `&${location.hash.slice(1)}` : '');
      try {
        localStorage.setItem('fimbulvetr.cloud.result', JSON.stringify({ query }));
      } catch {
        // Storage is blocked; the game times out and says signing in did not finish.
      }
      // The game ends `state` with ".r" when it sent this whole tab to Dropbox, and ".p" for a popup.
      const state = new URLSearchParams(query).get('state') ?? '';
      if (state.endsWith('.r')) location.replace('./');
      else window.close();
    </script>
  </body>
</html>
